idth="120" height="32" rx="6" fill="#FFFFFF" stroke="#CBD2DB"/><text x="400.0" y="435" fill="#1B2430" font-size="12" text-anchor="middle">Volver al listado</text><rect x="468" y="414" width="80" height="32" rx="6" fill="#1F4E8C" stroke="#1F4E8C"/><text x="508.0" y="435" fill="#FFFFFF" font-size="12" text-anchor="middle">Editar</text><text x="576" y="250" fill="#5B6676" font-size="22" text-anchor="start">→</text><rect x="604" y="62" width="330" height="400" rx="8" fill="#FFFFFF" stroke="#CBD2DB"/><text x="620" y="88" fill="#1B2430" font-size="13" font-weight="bold" text-anchor="start">Editar ciudadano</text><rect x="620" y="98" width="298" height="34" rx="6" fill="#E8F7EE" stroke="#1B6E3C"/><text x="634" y="120" fill="#1B6E3C" font-size="12" text-anchor="start">Cambios guardados para 9000000001.</text><text x="620" y="156" fill="#5B6676" font-size="11" text-anchor="start">Identificación *</text><rect x="620" y="162" width="298" height="32" rx="6" fill="#EEF1F4" stroke="#CBD2DB"/><text x="630" y="183" fill="#5B6676" font-size="12" text-anchor="start">9000000001  (no editable)</text><text x="620" y="216" fill="#5B6676" font-size="11" text-anchor="start">Nombres *</text><rect x="620" y="222" width="298" height="32" rx="6" fill="#FFFFFF" stroke="#CBD2DB"/><text x="630" y="243" fill="#1B2430" font-size="12" text-anchor="start">Clara</text><text x="620" y="272" fill="#5B6676" font-size="11" text-anchor="start">Lugar de nacimiento *</text><rect x="620" y="278" width="298" height="32" rx="6" fill="#FFFFFF" stroke="#CBD2DB"/><text x="630" y="299" fill="#1B2430" font-size="12" text-anchor="start">Sogamoso</text><text x="620" y="340" fill="#5B6676" font-size="11" text-anchor="start">… los otros 7 campos, igual que en Registrar</text><rect x="700" y="414" width="80" height="32" rx="6" fill="#FFFFFF" stroke="#CBD2DB"/><text x="740.0" y="435" fill="#1B2430" font-size="12" text-anchor="middle">Cancelar</text><rect x="788" y="414" width="130" height="32" rx="6" fill="#1F4E8C" stroke="#1F4E8C"/><text x="853.0" y="435" fill="#FFFFFF" font-size="12" text-anchor="middle">Guardar cambios</text><text x="214" y="492" fill="#8A5A00" font-size="10" text-anchor="start">✎ El formulario llega precargado (GET) y guarda con PUT /api/ciudadanos/{identificacion}.</text><text x="214" y="508" fill="#8A5A00" font-size="10" text-anchor="start">✎ La identificación es la clave: no se puede cambiar. Tras guardar se vuelve al detalle con la confirmación.</text><text x="214" y="524" fill="#8A5A00" font-size="10" text-anchor="start">✎ Identificación inexistente → «No se encontró un ciudadano…»; ruta inválida → página 404.</text>
