<text x="18" y="209" fill="#FFFFFF" font-size="12" text-anchor="start">Reportes</text>
<text x="18" y="558" fill="#B9C4D6" font-size="10" text-anchor="start">Sesión: 1012345678</text>
<rect x="18" y="570" width="154" height="30" rx="6" fill="#FFFFFF" stroke="#CBD2DB"/><text x="95" y="590" fill="#1B2430" font-size="12" text-anchor="middle">Cerrar sesión</text>
<text x="214" y="44" fill="#1B2430" font-size="20" font-weight="bold" text-anchor="start">Reportes</text>
<rect x="214" y="62" width="720" height="34" rx="6" fill="#FFF4DC" stroke="#8A5A00"/><text x="228" y="84" fill="#8A5A00" font-size="12" text-anchor="start">No hay ciudadanos con estado «No requerido». No se generó el reporte.</text><rect x="214" y="110" width="720" height="190" rx="8" fill="#FFFFFF" stroke="#CBD2DB"/><text x="232" y="140" fill="#1B2430" font-size="14" font-weight="bold" text-anchor="start">Reporte de ciudadanos por estado</text><text x="232" y="162" fill="#5B6676" font-size="11" text-anchor="start">Lista la identificación, nombres y apellidos de los ciudadanos con el estado elegido.</text><rect x="232" y="180" width="120" height="36" rx="6" fill="#EEF4FF" stroke="#1F4E8C"/><text x="246" y="203" fill="#1B2430" font-size="12" text-anchor="start">◉ Requerido</text><rect x="362" y="180" width="140" height="36" rx="6" fill="#FFFFFF" stroke="#CBD2DB"/><text x="376" y="203" fill="#1B2430" font-size="12" text-anchor="start">○ No requerido</text><rect x="726" y="248" width="80" height="32" rx="6" fill="#FFFFFF" stroke="#CBD2DB"/><text x="766.0" y="269" fill="#1B2430" font-size="12" text-anchor="middle">Ver PDF</text><rect x="814" y="248" width="104" height="32" rx="6" fill="#1F4E8C" stroke="#1F4E8C"/><text x="866.0" y="269" fill="#FFFFFF" font-size="12" text-anchor="middle">Descargar PDF</text><text x="214" y="334" fill="#8A5A00" font-size="10" text-anchor="start">✎ El PDF lo genera el backend (GET /api/reportes/ciudadanos?estado=); la web solo lo entrega.</text><text x="214" y="350" fill="#8A5A00" font-size="10" text-anchor="start">✎ «Ver PDF» lo abre en el navegador; «Descargar PDF» lo guarda como ciudadanos-&lt;estado&gt;-&lt;fecha&gt;.pdf.</text><text x="214" y="366" fill="#8A5A00" font-size="10" text-anchor="start">✎ Mensajes: sin resultados (arriba), «Seleccione un estado», y «No fue posible conectar… No se generó el reporte».</text>
</svg>
