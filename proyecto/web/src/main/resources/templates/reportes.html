<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reportes')}"></head>
<body class="panel">
  <nav th:replace="~{fragments/layout :: menu('reportes')}"></nav>
  <main>
    <header th:replace="~{fragments/layout :: encabezado('Reportes')}"></header>
    <div th:replace="~{fragments/componentes :: alertas}"></div>

    <!-- El PDF lo genera el backend (GET /api/reportes/ciudadanos?estado=); la web solo lo solicita.
         Sin data-cargando: al descargar, el navegador no cambia de página y la barra quedaría activa. -->
    <form class="tarjeta formulario" th:action="@{/reportes/pdf}" method="get">
      <fieldset>
        <legend>Reporte de ciudadanos por estado</legend>
        <p class="nota">Lista la identificación, nombres y apellidos de los ciudadanos con el estado elegido.</p>
        <div class="opciones">
          <label class="opcion" th:each="e, it : ${estados}">
            <input type="radio" name="estado" th:value="${e.name()}" required
                   th:checked="${e == estadoSeleccionado or (estadoSeleccionado == null and it.first)}">
            <span th:text="${e.etiqueta}">Requerido</span>
          </label>
        </div>
      </fieldset>
      <div class="acciones">
        <button type="submit" name="modo" value="ver">Ver PDF</button>
        <button type="submit" name="modo" value="descargar" class="primario">Descargar PDF</button>
      </div>
    </form>
  </main>
</body>
</html>
