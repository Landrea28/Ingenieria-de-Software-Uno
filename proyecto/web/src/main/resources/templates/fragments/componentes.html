<!DOCTYPE html>
<!-- Componentes reutilizables. Se incluyen con th:replace="~{fragments/componentes :: nombre(...)}". -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

  <!-- Mensajes generales. Lee mensajeExito, mensajeInfo y mensajeError del modelo
       (o de un flash attribute después de un redirect). -->
  <div th:fragment="alertas" class="alertas">
    <div th:if="${mensajeExito}" class="alerta exito" role="status" th:text="${mensajeExito}">Éxito</div>
    <div th:if="${mensajeInfo}" class="alerta info" role="status" th:text="${mensajeInfo}">Información</div>
    <div th:if="${mensajeError}" class="alerta error" role="alert" th:text="${mensajeError}">Error</div>
  </div>

  <!-- Consulta exacta por identificación: lleva directo al detalle del ciudadano. -->
  <form th:fragment="consultaIdentificacion" th:action="@{/ciudadanos/consulta}" method="get"
        class="consulta-id" data-cargando role="search">
    <label for="consulta-identificacion">Consultar por identificación</label>
    <div>
      <input id="consulta-identificacion" name="identificacion" type="text" inputmode="numeric"
             required placeholder="Ej. 9000000001" autocomplete="off">
      <button type="submit" class="primario">Consultar</button>
    </div>
  </form>

  <!-- Tabla genérica.
       columnas: lista de títulos; filas: fragmento con los <tr>;
       vacia: true si no hay datos; mensajeVacio: texto a mostrar en ese caso. -->
  <div th:fragment="tabla(columnas, filas, vacia, mensajeVacio)" class="tabla-contenedor">
    <table>
      <thead>
        <tr><th scope="col" th:each="columna : ${columnas}" th:text="${columna}">Columna</th></tr>
      </thead>
      <tbody>
        <th:block th:replace="${filas}"></th:block>
        <tr th:if="${vacia}">
          <td class="vacio" th:colspan="${#lists.size(columnas)}" th:text="${mensajeVacio}">Sin datos</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Campo obligatorio de texto/fecha/número con su mensaje de validación.
       Debe usarse dentro de un <form th:object="...">; 'nombre' es la propiedad del objeto.
       'reglas' es un mapa con atributos HTML (patron, maximo, min, max, paso, teclado, ejemplo,
       mensaje, despuesDe, mensajeDespuesDe); las claves que falten no generan atributo.
       El <small> siempre existe: ahí escriben los errores el servidor y validacion.js. -->
  <label th:fragment="campo(nombre, etiqueta, tipo, reglas, soloLectura)" class="campo"
         th:classappend="${#fields.hasErrors(nombre)} ? 'con-error'">
    <span><th:block th:text="${etiqueta}">Etiqueta</th:block> <abbr class="obligatorio" title="Obligatorio">*</abbr></span>
    <input th:type="${tipo}" th:field="*{__${nombre}__}" required th:readonly="${soloLectura}"
           th:pattern="${reglas['patron']}" th:maxlength="${reglas['maximo']}"
           th:min="${reglas['min']}" th:max="${reglas['max']}" th:step="${reglas['paso']}"
           th:inputmode="${reglas['teclado']}" th:placeholder="${reglas['ejemplo']}"
           th:data-mensaje="${reglas['mensaje']}" th:data-despues-de="${reglas['despuesDe']}"
           th:data-mensaje-despues-de="${reglas['mensajeDespuesDe']}"
           th:aria-describedby="|error-${nombre}|" th:aria-invalid="${#fields.hasErrors(nombre)}">
    <small class="error-campo" th:id="|error-${nombre}|" aria-live="polite"
           th:text="${#strings.listJoin(#fields.errors(nombre), ' ')}"></small>
  </label>

  <!-- Lista desplegable obligatoria con su mensaje de validación. -->
  <label th:fragment="selector(nombre, etiqueta, opciones)" class="campo"
         th:classappend="${#fields.hasErrors(nombre)} ? 'con-error'">
    <span><th:block th:text="${etiqueta}">Etiqueta</th:block> <abbr class="obligatorio" title="Obligatorio">*</abbr></span>
    <select th:field="*{__${nombre}__}" required
            th:aria-describedby="|error-${nombre}|" th:aria-invalid="${#fields.hasErrors(nombre)}">
      <option value="">Seleccione…</option>
      <option th:each="opcion : ${opciones}" th:value="${opcion}" th:text="${opcion}">Opción</option>
    </select>
    <small class="error-campo" th:id="|error-${nombre}|" aria-live="polite"
           th:text="${#strings.listJoin(#fields.errors(nombre), ' ')}"></small>
  </label>

</body>
</html>
