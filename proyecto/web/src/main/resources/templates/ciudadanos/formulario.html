<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modoEdicion} ? 'Editar ciudadano' : 'Registrar ciudadano')}"></head>
<body class="panel">
  <nav th:replace="~{fragments/layout :: menu(${modoEdicion} ? 'ciudadanos' : 'nuevo')}"></nav>
  <main>
    <header th:replace="~{fragments/layout :: encabezado(${modoEdicion} ? 'Editar ciudadano' : 'Registrar ciudadano')}"></header>
    <div th:replace="~{fragments/componentes :: alertas}"></div>

    <!-- Los 10 campos con los nombres de la API. En edición la identificación no se cambia
         porque el backend la usa como clave (PUT /api/ciudadanos/{identificacion}). -->
    <form class="tarjeta formulario" method="post" th:object="${ciudadanoForm}"
          th:action="${modoEdicion} ? @{/ciudadanos/{id}(id=*{identificacion})} : @{/ciudadanos}">

      <fieldset>
        <legend>Datos personales</legend>
        <div class="campos">
          <label th:replace="~{fragments/componentes :: campo('identificacion', 'Identificación', 'text', ${modoEdicion})}"></label>
          <label th:replace="~{fragments/componentes :: campo('nombres', 'Nombres', 'text', false)}"></label>
          <label th:replace="~{fragments/componentes :: campo('apellidos', 'Apellidos', 'text', false)}"></label>
          <label th:replace="~{fragments/componentes :: campo('fechaNacimiento', 'Fecha de nacimiento', 'date', false)}"></label>
          <label th:replace="~{fragments/componentes :: campo('lugarNacimiento', 'Lugar de nacimiento', 'text', false)}"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Documento</legend>
        <div class="campos">
          <label th:replace="~{fragments/componentes :: campo('fechaExpedicion', 'Fecha de expedición', 'date', false)}"></label>
          <label th:replace="~{fragments/componentes :: campo('lugarExpedicion', 'Lugar de expedición', 'text', false)}"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Datos físicos</legend>
        <div class="campos">
          <label th:replace="~{fragments/componentes :: selector('grupoSanguineo', 'Grupo sanguíneo', ${ {'A', 'B', 'AB', 'O'} })}"></label>
          <label th:replace="~{fragments/componentes :: selector('rh', 'RH', ${ {'+', '-'} })}"></label>
          <label th:replace="~{fragments/componentes :: campo('estatura', 'Estatura (m)', 'number', false)}"></label>
        </div>
      </fieldset>

      <div class="acciones">
        <a th:href="@{/ciudadanos}" class="boton">Cancelar</a>
        <button type="submit" class="primario">Guardar (simulado)</button>
      </div>
    </form>
  </main>
</body>
</html>
