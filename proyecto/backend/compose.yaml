services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: consulta_ciudadano
      POSTGRES_USER: consulta
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ciudadano_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U consulta -d consulta_ciudadano']
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  ciudadano_postgres:
