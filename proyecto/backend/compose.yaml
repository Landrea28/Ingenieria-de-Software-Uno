services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: consulta_ciudadano
      POSTGRES_USER: consulta
      POSTGRES_PASSWORD: consulta_local
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ciudadano_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U consulta -d consulta_ciudadano']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ciudadano_postgres:
