server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: sistema-consulta-ciudadano
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/consulta_ciudadano}
    username: ${DB_USER:consulta}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    url: /openapi/openapi.yaml
    path: /swagger-ui.html
    disable-swagger-default-url: true
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: []
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
security:
  jwt:
    secret: ${JWT_SECRET}
    short-ttl: ${JWT_SHORT_TTL:PT15M}
    remember-ttl: ${JWT_REMEMBER_TTL:PT8H}
admin:
  initial:
    identificacion: ${ADMIN_INITIAL_IDENTIFICACION:}
    email: ${ADMIN_INITIAL_EMAIL:}
    password: ${ADMIN_INITIAL_PASSWORD:}
