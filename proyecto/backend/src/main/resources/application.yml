server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: sistema-consulta-ciudadano
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/consulta_ciudadano}
    username: ${DB_USER:consulta}
    password: ${DB_PASSWORD:consulta_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /openapi/openapi.yaml
    path: /swagger-ui.html
    disable-swagger-default-url: true
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
