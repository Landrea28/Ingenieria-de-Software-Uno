<svg viewBox="0 0 320 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="320" height="640" fill="#F4F6F8" stroke="#1B2430" stroke-width="2"/>
  <rect x="0" y="0" width="320" height="56" fill="#1F4E8C"/>
  <text x="160" y="34" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Resultado</text>

  <text x="20" y="84" fill="#5B6676" font-size="12">Identificación: 9000000003</text>

  <!-- badge requerido -->
  <rect x="20" y="104" width="280" height="110" rx="12" fill="#FDECEA"/>
  <text x="160" y="160" fill="#B42318" font-size="26" font-weight="bold" text-anchor="middle">REQUERIDO</text>
  <text x="160" y="184" fill="#5B6676" font-size="11" text-anchor="middle">Actualizado: 2026-11-05T18:08:42Z</text>

  <!-- aviso sin informacion (estado alterno) -->
  <rect x="20" y="230" width="280" height="64" rx="8" fill="#FFF4DC"/>
  <text x="30" y="250" fill="#8A5A00" font-size="9">Sin información registrada. No equivale a</text>
  <text x="30" y="263" fill="#8A5A00" font-size="9">«no requerido»; confirma por otro medio si</text>
  <text x="30" y="276" fill="#8A5A00" font-size="9">lo necesitas.</text>

  <rect x="20" y="520" width="280" height="48" rx="10" fill="#1F4E8C"/>
  <text x="160" y="549" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Escanear otra cédula</text>

  <rect x="20" y="576" width="280" height="44" rx="10" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2"/>
  <text x="160" y="603" fill="#1F4E8C" font-size="13" font-weight="bold" text-anchor="middle">Volver al inicio</text>

  <text x="160" y="312" fill="#5B6676" font-size="10" text-anchor="middle">(badge verde "NO REQUERIDO" si aplica)</text>
</svg>
