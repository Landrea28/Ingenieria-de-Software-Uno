<svg viewBox="0 0 320 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="320" height="640" fill="#F4F6F8" stroke="#1B2430" stroke-width="2"/>
  <rect x="0" y="0" width="320" height="56" fill="#1F4E8C"/>
  <text x="160" y="34" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Iniciar sesión</text>

  <!-- aviso modo mock -->
  <rect x="16" y="68" width="288" height="28" rx="6" fill="#FFF4DC"/>
  <text x="160" y="86" fill="#8A5A00" font-size="9" text-anchor="middle">Modo simulado: respuestas de un servidor falso</text>

  <!-- campo identificacion -->
  <text x="20" y="118" fill="#1B2430" font-size="12" font-weight="bold">Identificación</text>
  <rect x="20" y="124" width="280" height="40" rx="8" fill="#FFFFFF" stroke="#CBD2DB"/>
  <text x="30" y="149" fill="#5B6676" font-size="12">Solo números, 6 a 10 dígitos</text>

  <!-- campo contrasena -->
  <text x="20" y="188" fill="#1B2430" font-size="12" font-weight="bold">Contraseña</text>
  <rect x="20" y="194" width="280" height="40" rx="8" fill="#FFFFFF" stroke="#CBD2DB"/>
  <text x="30" y="219" fill="#5B6676" font-size="12">••••••••</text>

  <!-- recordar -->
  <text x="20" y="260" fill="#1B2430" font-size="13" font-weight="bold">Recordar contraseña</text>
  <text x="20" y="276" fill="#5B6676" font-size="10">Guarda un token cifrado, nunca la contraseña</text>
  <rect x="258" y="252" width="42" height="24" rx="12" fill="#CBD2DB"/>
  <circle cx="270" cy="264" r="10" fill="#FFFFFF"/>

  <!-- error general -->
  <rect x="20" y="296" width="280" height="36" rx="8" fill="#FDECEA"/>
  <text x="30" y="318" fill="#B42318" font-size="11">Identificación o contraseña incorrectas</text>

  <!-- boton iniciar -->
  <rect x="20" y="348" width="280" height="48" rx="10" fill="#1F4E8C"/>
  <text x="160" y="377" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">Iniciar sesión</text>

  <!-- boton registrarme -->
  <rect x="20" y="406" width="280" height="48" rx="10" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2"/>
  <text x="160" y="435" fill="#1F4E8C" font-size="15" font-weight="bold" text-anchor="middle">Registrarme</text>

  <text x="160" y="600" fill="#5B6676" font-size="10" text-anchor="middle">Mockup — pantalla de acceso</text>
</svg>
