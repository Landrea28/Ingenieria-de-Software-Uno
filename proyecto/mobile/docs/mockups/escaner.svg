<svg viewBox="0 0 320 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="320" height="640" fill="#F4F6F8" stroke="#1B2430" stroke-width="2"/>
  <rect x="0" y="0" width="320" height="56" fill="#1F4E8C"/>
  <text x="160" y="34" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Escanear cédula</text>

  <!-- visor de camara -->
  <rect x="16" y="68" width="288" height="360" rx="12" fill="#111417"/>
  <rect x="68" y="190" width="184" height="100" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="160" y="320" fill="#FFFFFF" font-size="11" text-anchor="middle">Apunta la cámara al código de barras</text>
  <text x="160" y="336" fill="#FFFFFF" font-size="11" text-anchor="middle">de la cédula</text>

  <!-- aviso codigo no legible (estado alterno) -->
  <rect x="40" y="440" width="240" height="46" rx="8" fill="#FDECEA"/>
  <text x="160" y="458" fill="#B42318" font-size="10" text-anchor="middle">No se pudo leer el código.</text>
  <text x="160" y="472" fill="#B42318" font-size="10" text-anchor="middle">Intenta de nuevo con buena luz.</text>

  <rect x="20" y="498" width="280" height="44" rx="10" fill="#FFFFFF" stroke="#1F4E8C" stroke-width="2"/>
  <text x="160" y="525" fill="#1F4E8C" font-size="13" font-weight="bold" text-anchor="middle">Ingresar identificación manualmente</text>

  <rect x="20" y="552" width="280" height="44" rx="10" fill="#FFFFFF" stroke="#CBD2DB" stroke-width="2"/>
  <text x="160" y="579" fill="#5B6676" font-size="13" font-weight="bold" text-anchor="middle">Cancelar</text>

  <text x="160" y="620" fill="#5B6676" font-size="10" text-anchor="middle">Mockup — estados: escaneando / código ilegible / permiso denegado / manual</text>
</svg>
